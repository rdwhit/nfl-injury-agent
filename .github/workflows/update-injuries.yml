name: Update NFL injuries

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-injuries
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the injury agent
        run: python update_injuries.py

      - name: Save updated data
        run: |
          git config user.name "injury-agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Injury update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
