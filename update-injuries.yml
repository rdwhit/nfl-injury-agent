# This file tells GitHub to run the injury agent on a schedule.
# You don't need to edit it, except to change how often it runs (see "cron" below).

name: Update NFL injuries

on:
  schedule:
    # Runs every 3 hours. Times are in UTC.
    # To change: "0 */6 * * *" = every 6 hours, "0 13 * * *" = once a day at 9am Eastern.
    - cron: "0 */3 * * *"
  workflow_dispatch:   # adds a "Run workflow" button so you can run it any time

permissions:
  contents: write      # lets the agent save the updated data files back to your repo

concurrency:
  group: update-injuries
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the injury agent
        run: python update_injuries.py

      - name: Save updated data
        run: |
          git config user.name "injury-agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Injury update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
